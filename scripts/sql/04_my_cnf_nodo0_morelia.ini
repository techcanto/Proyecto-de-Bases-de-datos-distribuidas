# =============================================================================
# 04_my_cnf_nodo0_morelia.ini
# Configuración de MariaDB para el NODO 0 (Morelia, 100.120.137.4)
#
# Copiar / fusionar este bloque en:
#   /etc/mysql/mariadb.conf.d/50-server.cnf   (Debian/Ubuntu)
#   /etc/my.cnf.d/server.cnf                  (RHEL/Arch)
#
# Después de editar: sudo systemctl restart mariadb
# =============================================================================

[mariadb]

# ── Escuchar en todas las interfaces (incluida Tailscale 100.x.x.x) ──────────
# CRÍTICO: si esto es 127.0.0.1, las conexiones remotas son imposibles
bind-address            = 0.0.0.0

# ── Replicación: identificador único del nodo ─────────────────────────────────
# Cada nodo DEBE tener un server-id diferente; usamos 1 para Morelia
server-id               = 1

# ── Binlog: necesario para actuar como MASTER ─────────────────────────────────
log_bin                 = /var/log/mysql/mariadb-bin
log_bin_index           = /var/log/mysql/mariadb-bin.index
expire_logs_days        = 7
max_binlog_size         = 100M

# ── Replicación bidireccional: solo replicar las BD del proyecto ──────────────
# Así evitamos replicar tablas internas de mysql/sys entre nodos
binlog_do_db            = sucursal_morelia

# ── Como SLAVE: ignorar actualizaciones del propio servidor
# (evita bucles de replicación en setup M-M)
# log_slave_updates     = OFF   ← ya es OFF por defecto en replicación simple

# ── Formato del binlog: ROW es más confiable que STATEMENT para datos UTF-8
binlog_format           = ROW

# ── Charset por defecto (soporte de caracteres especiales como ñ, acentos) ───
character-set-server    = utf8mb4
collation-server        = utf8mb4_unicode_ci
