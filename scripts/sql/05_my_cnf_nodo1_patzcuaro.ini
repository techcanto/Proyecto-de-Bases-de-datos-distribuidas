# =============================================================================
# 05_my_cnf_nodo1_patzcuaro.ini
# Configuración de MariaDB para el NODO 1 (Pátzcuaro, 100.119.128.65)
#
# Copiar / fusionar en /etc/mysql/mariadb.conf.d/50-server.cnf
# Después: sudo systemctl restart mariadb
# =============================================================================

[mariadb]

bind-address            = 0.0.0.0

# server-id DIFERENTE al nodo 0
server-id               = 2

log_bin                 = /var/log/mysql/mariadb-bin
log_bin_index           = /var/log/mysql/mariadb-bin.index
expire_logs_days        = 7
max_binlog_size         = 100M

binlog_do_db            = suc_patzcuaro

binlog_format           = ROW

character-set-server    = utf8mb4
collation-server        = utf8mb4_unicode_ci
